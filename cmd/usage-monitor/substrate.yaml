# The Station usage monitor on Substrate. The manifest is the shell: modules and config.
# Secure by default: the guard enforces and the service is its own identity provider, so
# clients (readers, the operator, push reporters) use keys issued by the identity module.
app: usage-monitor
variant: service
profiles: [minimal]
modules:
  add: [httphost, secrets, auth, database, identity, cli]
config:
  logging: { level: info, format: text }
  httphost: { addr: "127.0.0.1:18086" }  # a port no live unit holds; the live monitor uses 18083 and is cut over by its own SUBSTRATE_CONFIG
  # Relative paths here are resolved against the data directory (USAGE_MONITOR_DATA_DIR or the XDG
  # data home) by the AfterConfig hook, after the SUBSTRATE_CONFIG override is applied.
  database:
    sqlite: { path: usage-monitor.db }
  auth: { mode: enforce }
  identity: { key_file: identity-signing.key }
  secrets: { state_dir: secrets }
  # The app's own block: accounts and sources (the bootstrap), poll_interval, stale_after and the
  # Host names served besides loopback. Accounts seed new accounts only; later edits use the API.
  usage-monitor:
    allowed_hosts: []
