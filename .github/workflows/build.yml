name: build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    uses: hollis-labs/tools/.github/workflows/go-app-build.yml@27c5d904a7dfafbb71dca884b0d31fc0849d39fb   # tools#9 merge commit
    with:
      app: station
      main_pkg: ./cmd/station
      binary: station
      test_cmd: 'test -z "$(gofmt -l .)" && go mod tidy -diff && go build ./... && go vet ./... && go test -race -count=1 -timeout 4m ./...'
