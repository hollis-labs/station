name: Go
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Dependencies
        run: go mod tidy -diff
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 run ./...
      - name: Pins match the Substrate BOM
        run: go run github.com/hollis-labs/substrate/cmd/substrate pins check --app .
      - name: Public hygiene (tree)
        # The history gate (--ref HEAD) returns after the program-wide history pass.
        run: go run github.com/hollis-labs/substrate/cmd/substrate scan-public --tree
      - name: Tests with the real binaries
        run: go test -race -count=1 -timeout 4m ./...
