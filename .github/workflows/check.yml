name: Go
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Dependencies
        run: go mod tidy -diff
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Lint (new code)
        # Scoped to the ported code. Widen to ./... once cmd/station, platform/ and plugins/ are gone
        # (see "What the last port must do" in docs/conversion-notes.md).
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 run ./cmd/station-next/... ./cmd/llm-gateway/... ./cmd/usage-monitor/... ./internal/...
      - name: Pins match the Substrate BOM
        run: go run github.com/hollis-labs/substrate/cmd/substrate pins check --app .
      - name: Public hygiene (tree)
        # The history gate (--ref HEAD) returns after the program-wide history pass.
        run: go run github.com/hollis-labs/substrate/cmd/substrate scan-public --tree
      - name: Tests with real Station and plugin children
        run: go test -race -count=1 -timeout 4m ./...
