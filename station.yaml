# Station's own config: two starter virtual MCPs, proving mcp-host is
# feature-complete enough to build a real prototype on. Swap these two
# plugins out for Station's actual first capabilities whenever they're
# decided — everything about wiring a new one up is in
# libs/mcp-host/README.md ("Adding a new logical server").
logical_servers:
  - id: echo
    name: Echo Server
    description: Process-mode virtual MCP — a real, standalone MCP server.
    transport: process
    process:
      command: ./bin/echo-server
      args: []
    serve:
      stdio: true

  - id: clock
    name: Clock Plugin
    description: Inprocess-mode virtual MCP — a lightweight plugin-sdk subprocess.
    transport: inprocess
    inprocess:
      command: ./bin/clock-plugin
      # Tool catalog is declared here, not discovered from the running
      # plugin — mcp-host never sends mcp/list_tools.
      tools:
        - name: now
          description: Returns the current UTC time in RFC 3339 format.
          input_schema:
            type: object
            properties: {}
            additionalProperties: false
          annotations:
            readOnlyHint: true
            destructiveHint: false
            idempotentHint: false
            openWorldHint: false
    serve:
      http:
        path: /clock
        allowed_origins: []
        bearer_tokens: []

  - id: github-pilot
    name: GitHub Releases (api-projection pilot)
    description: >-
      Process-mode virtual MCP — CW-20260918-0054 / ATLAS-FOLLOWUP-013's
      api-projection pilot. Projects one read-only GitHub REST operation
      (list releases) through a manifest-driven interpreter; see
      ../../libs/api-projection and its pilots/github-releases/ manifest.
    transport: process
    process:
      command: ./bin/api-projection-server
      args:
        - -manifest
        - ../../libs/api-projection/pilots/github-releases/manifest.yaml
      env:
        # Resolved from the OS keychain before spawn — see
        # internal/secretref.Resolve, called from cmd/station before
        # mcphost.Run. This process itself never touches the credential
        # store (adr_api_to_mcp_projection, decision 4).
        GITHUB_TOKEN: "keychain://api-projection/github-pilot"
    serve:
      http:
        path: /github-pilot
        allowed_origins: []
        bearer_tokens: []
